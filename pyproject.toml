[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cudagraph-decoder"
version = "0.1.0"
description = "A small PyTorch project that accelerates decoder inference with CUDA Graphs."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
cudagraph-decoder-bench = "cudagraph_decoder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
